<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Local Chat</title>
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0b0f1a;
            --card: rgba(22, 28, 45, 0.95);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --success: #22c55e;
            --warning: #eab308;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.2) 0px, transparent 50%);
            color: var(--text);
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            height: calc(100dvh - 40px);
            background: var(--card);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border);
            border-radius: 32px;
            display: grid;
            grid-template-columns: 350px 1fr;
            overflow: hidden;
            box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.7);
        }

        @media (max-width: 900px) {
            body {
                padding: 0;
            }

            .container {
                grid-template-columns: 1fr;
                height: 100%;
                border-radius: 0;
                border: none;
                grid-template-rows: auto 1fr;
            }

            .sidebar {
                border-right: none !important;
                border-bottom: 1px solid var(--border);
                padding: 16px !important;
                flex-direction: row !important;
                height: auto !important;
                overflow-x: auto;
                gap: 16px !important;
            }

            .sidebar-hide-mobile {
                display: none !important;
            }

            .peer-list {
                flex: none !important;
                display: flex !important;
                flex-direction: row !important;
                gap: 8px;
            }

            .peer-card {
                flex-shrink: 0;
                margin-bottom: 0 !important;
                min-width: 140px;
            }

            .input-bar {
                padding: 12px 16px env(safe-area-inset-bottom, 12px) !important;
            }
        }

        .sidebar {
            padding: 32px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 24px;
            background: rgba(0, 0, 0, 0.2);
            height: 100%;
        }

        .status-card {
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .status-card h2 {
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .status-card p {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: monospace;
            cursor: pointer;
            text-decoration: underline;
        }

        .radar-box {
            position: relative;
            width: 100%;
            aspect-ratio: 1.2;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .radar-line {
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(from 0deg, transparent, rgba(99, 102, 241, 0.4));
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .peer-list {
            flex: 1;
            overflow-y: auto;
        }

        .peer-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 12px;
            border: 1px solid transparent;
            transition: 0.2s;
        }

        .peer-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .chat-area {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.1);
            height: 100%;
            overflow: hidden;
        }

        .header {
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
            min-height: 0;
        }

        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .msg {
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 20px;
            line-height: 1.5;
            font-size: 0.95rem;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .msg.sent {
            align-self: flex-end;
            background: var(--primary);
            border-bottom-right-radius: 4px;
        }

        .msg.received {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .msg.alert {
            align-self: center;
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid var(--warning);
            color: var(--warning);
            text-align: center;
            max-width: 100%;
            border-radius: 12px;
        }

        .file-preview {
            margin-top: 8px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.2);
            max-width: 300px;
        }

        .file-preview img {
            width: 100%;
            display: block;
            cursor: pointer;
        }

        .reactions {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }

        .reaction-chip {
            padding: 4px 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border);
            border-radius: 99px;
            font-size: 0.8rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .reaction-chip:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .reaction-chip .count {
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--primary);
            display: none;
            /* Hidden by default, shown when > 1 */
        }

        .reaction-chip.has-count .count {
            display: inline;
        }

        .typing-indicator {
            font-size: 0.65rem;
            color: var(--primary);
            font-style: italic;
            opacity: 0;
            transition: 0.3s;
            margin-bottom: 8px;
        }

        .typing-indicator.active {
            opacity: 1;
        }

        .input-bar {
            padding: 24px 32px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            background: rgba(0, 0, 0, 0.2);
            flex-shrink: 0;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 20px;
            color: white;
            outline: none;
            transition: 0.2s;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border-radius: 14px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-warning {
            background: var(--warning);
            color: black;
        }

        .shake {
            animation: shake-anim 0.4s ease-in-out;
        }

        @keyframes shake-anim {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.2s;
        }

        .file-info {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Call UI */
        #callOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(20px);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 90%;
            max-width: 1200px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            background: #000;
        }

        .video-container {
            position: relative;
            aspect-ratio: 16/9;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .video-label {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 0.75rem;
            color: white;
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .local-video {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 200px !important;
            border: 2px solid var(--primary);
            z-index: 10;
        }

        .call-controls {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 20px;
            z-index: 11;
        }

        .btn-round {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-hangup {
            background: #ef4444;
            color: white;
        }

        .btn-hangup:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        .btn-mute {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid var(--border);
        }

        .btn-mute.active {
            background: #ef4444;
            border-color: #ef4444;
        }

        /* Giphy UI */
        .giphy-panel {
            position: absolute;
            bottom: 110px;
            left: 32px;
            right: 32px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            display: none;
            flex-direction: column;
            gap: 12px;
            z-index: 100;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .giphy-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .giphy-thumb {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .giphy-thumb:hover {
            transform: scale(1.03);
            border-color: var(--primary);
        }
    </style>
</head>

<body>

    <div class="container" id="appShell">
        <div class="sidebar">
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <img src="logo.png" alt="Local Chat Logo"
                    style="width: 120px; height: auto; border-radius: 12px; filter: drop-shadow(0 0 10px var(--primary));">
            </div>
            <div class="status-card">
                <h2 id="meshCount">0 Peers Online</h2>
                <p id="ipTag" onclick="changeRoom()">Detecting Network...</p>
            </div>
            <div class="radar-box sidebar-hide-mobile">
                <div class="radar-line"></div>
                <div
                    style="z-index:10; font-size:0.65rem; font-weight:bold; background:rgba(0,0,0,0.5); padding:4px 8px; border-radius:99px;">
                    SCANNING</div>
            </div>
            <div class="peer-list">
                <label class="sidebar-hide-mobile"
                    style="font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;">Nearby
                    Peers</label>
                <div id="peerStack" style="padding-top:10px">
                    <div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.75rem;">Waiting
                        for devices...</div>
                </div>
            </div>
            <button class="btn-warning" onclick="pingAll()" style="width:100%">📢 GLOBAL PING</button>
            <button class="btn-primary" style="width:100%; font-size:0.75rem; background:rgba(255,255,255,0.05)"
                onclick="openOfflineSub()">Offline Alerts</button>
            <button id="createGroupBtn" class="btn-primary" style="width:100%; display:none; margin-top:10px;"
                onclick="createGroup()">Create Group (0)</button>
        </div>

        <div class="chat-area">
            <div class="header">
                <div>
                    <h3 id="roomName">P2P Secure Mesh</h3>
                    <div style="font-size: 0.7rem; color: var(--success); margin-top: 4px;">• Status: Encryption Active
                    </div>
                </div>
                <div style="display:flex; align-items:center; gap:10px">
                    <label
                        style="font-size: 0.65rem; color: var(--text-muted); display:flex; align-items:center; gap:4px">
                        <input type="checkbox" id="requireApproval"
                            onchange="localStorage.setItem('requireApproval', this.checked)">
                        🔒 Approval Req.
                    </label>
                    <button class="btn-primary"
                        style="font-size:0.7rem; padding:6px 12px; background:var(--success); border-radius:10px;"
                        onclick="startGroupCall()">Group Call</button>
                    <button class="btn-primary" style="font-size:0.7rem; padding:6px 12px;"
                        onclick="exportChat()">Export (.txt)</button>
                    <span style="font-size:0.75rem; color:var(--text-muted)">Me:</span>
                    <input type="text" id="userName" placeholder="Nick"
                        onchange="localStorage.setItem('chatName', this.value)"
                        style="width:100px; padding:6px 12px; font-size:0.8rem; border-radius:10px; flex:none;">
                </div>
            </div>

            <div id="messages">
                <div class="msg received">
                    <div style="font-size:0.7rem; opacity:0.6; margin-bottom:4px;">System</div>
                    <b>Modern Suite Enabled.</b> Click the Sync ID in the sidebar to manually connect if automatic
                    discovery is blocked.
                </div>
            </div>

            <div id="typingArea" class="typing-indicator" style="padding: 0 32px"></div>

            <div id="giphyPanel" class="giphy-panel">
                <input type="text" id="giphySearch" placeholder="Search GIFs..." oninput="searchGIFs(this.value)"
                    style="width:100%">
                <div id="giphyGrid" class="giphy-grid"></div>
            </div>

            <div class="input-bar">
                <input type="file" id="fileInput" style="display:none" multiple onchange="sendFiles(this.files)">
                <button class="btn-primary" onclick="document.getElementById('fileInput').click()"
                    style="padding: 14px; border-radius: 50%;">📎</button>
                <button class="btn-primary" onclick="toggleGiphy()"
                    style="padding: 14px; border-radius: 50%; background: #ff6b6b">🎬</button>
                <input type="text" id="chatInput" placeholder="Write a message..."
                    onkeypress="if(event.key==='Enter') sendAll()" oninput="sendTyping()">
                <button class="btn-primary" onclick="sendAll()">Send</button>
            </div>
        </div>
    </div>

    <!-- Call Overlay -->
    <div id="callOverlay">
        <div class="video-grid" id="remoteVideos">
            <!-- Remote videos will be injected here -->
        </div>
        <video id="localVideo" class="local-video" autoplay muted playsinline></video>
        <div id="callStatus"
            style="margin-top: 20px; font-weight: bold; color: var(--text-muted); position: absolute; bottom: 120px;">
            Calling...</div>
        <div class="call-controls">
            <button id="micBtn" class="btn-round btn-mute" onclick="toggleMic()">🎤</button>
            <button class="btn-round btn-hangup" onclick="endCall()">📞</button>
            <button id="camBtn" class="btn-round btn-mute" onclick="toggleCam()">📷</button>
        </div>
    </div>

    <script>
        const APP_KEY = "AG_MOD_01";
        const CHUNK_SIZE = 16384 * 4; // 64KB per chunk
        let peer, hubPeer;
        let connections = new Map();
        let activeCalls = new Map(); // peerId -> call object
        let localStream = null;
        let isHost = false;
        let fileChunks = {}; // { fileId: { chunks: [], received: 0, total: 0 } }
        let myShortId = sessionStorage.getItem('p2pId') || Math.random().toString(36).substring(2, 6).toUpperCase();
        sessionStorage.setItem('p2pId', myShortId);

        const savedName = localStorage.getItem('chatName') || "Dev-" + myShortId;
        document.getElementById('userName').value = savedName;

        function getColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash) % 360}, 65%, 45%)`;
        }

        async function init() {
            try {
                const res = await fetch('https://api.ipify.org?format=json').catch(() => null);
                const data = res ? await res.json() : null;
                const networkKey = (data && data.ip) ? data.ip.replace(/\./g, '-') : "LAN-" + Math.floor(1000 + Math.random() * 9000);
                document.getElementById('ipTag').innerText = `Sync ID: ${networkKey}`;
                startP2P(networkKey);

                // Initialize approval checkbox state
                const approvalChecked = localStorage.getItem('requireApproval') === 'true';
                document.getElementById('requireApproval').checked = approvalChecked;

            } catch (err) { console.error(err); }
        }

        function changeRoom() {
            const newKey = prompt("Enter a Sync Room name (e.g. 'Office') to connect manually:");
            if (newKey) {
                const cleanKey = newKey.toUpperCase().replace(/[^A-Z0-9]/g, '-');
                joinRoom(cleanKey);
            }
        }

        function applyRoomTheme(roomName) {
            const color = getColor(roomName);
            document.documentElement.style.setProperty('--primary', color);

            // Extract hue for related colors
            const hue = color.match(/\d+/)[0];
            document.documentElement.style.setProperty('--primary-hover', `hsl(${hue}, 65%, 35%)`);

            // Update the radar color with proper HSLA syntax
            const radarLine = document.querySelector('.radar-line');
            if (radarLine) {
                radarLine.style.background = `conic-gradient(from 0deg, transparent, hsla(${hue}, 65%, 45%, 0.4))`;
            }

            // Update container border and status card for more visual feedback
            const container = document.querySelector('.container');
            if (container) container.style.borderColor = `hsla(${hue}, 65%, 45%, 0.3)`;

            const roomIndicator = document.getElementById('roomName');
            if (roomIndicator) roomIndicator.style.color = color;
        }

        function startP2P(networkKey) {
            applyRoomTheme(networkKey);
            document.getElementById('roomName').innerText = `Room: ${networkKey}`;
            const myId = `${APP_KEY}-N-${networkKey}-${myShortId}`;
            const hubId = `${APP_KEY}-H-${networkKey}`;

            peer = new Peer(myId, { debug: 1, secure: true, config: { 'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }] } });

            peer.on('open', (id) => {
                const hubConn = peer.connect(hubId);
                setupConn(hubConn);

                // Try to become the hub peer
                hubPeer = new Peer(hubId, { debug: 0, secure: true });
                hubPeer.on('open', () => {
                    isHost = true;
                    addSystemMsg("Host Privileges Active: You are the gatekeeper.");
                    hubPeer.on('connection', c => {
                        c.on('data', d => {
                            if (d.type === 'join_request') {
                                const needsApproval = document.getElementById('requireApproval').checked;
                                if (!needsApproval || confirm(`Admission Request: Allow "${d.name}" to join this room?`)) {
                                    const peerList = Array.from(connections.keys()).filter(id => !id.includes('-H-'));
                                    c.send({ type: 'join_response', allowed: true, peerList });
                                    setupConn(c);
                                    relayNewNode(c.peer);
                                } else {
                                    c.send({ type: 'join_response', allowed: false, reason: 'Entry denied by room host' });
                                    setTimeout(() => c.close(), 500);
                                }
                            }
                        });
                    });
                });

                hubPeer.on('error', (err) => {
                    if (err.type === 'unavailable-id') isHost = false;
                });
            });

            peer.on('connection', c => setupConn(c));
            peer.on('call', handleIncomingCall);
        }

        // Periodic gossip to keep the mesh alive
        setInterval(() => {
            if (connections.size === 0) return;
            const allPeers = Array.from(connections.keys()).filter(id => !id.includes('-H-'));
            connections.forEach(c => {
                if (c.open) c.send({ type: 'mesh_gossip', ids: allPeers });
            });
        }, 15000);

        async function handleIncomingCall(call) {
            if (activeCalls.has(call.peer)) return; // Prevent double trigger

            const peerName = (connections.get(call.peer) && connections.get(call.peer).remoteName) || call.peer.split('-').pop();

            if (activeCalls.size > 0 || confirm(`Incoming call from ${peerName}. Answer?`)) {
                try {
                    if (!localStream) {
                        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                        document.getElementById('localVideo').srcObject = localStream;
                    }
                    call.answer(localStream);
                    setupCall(call);
                } catch (err) {
                    console.error("Call error:", err);
                    call.close();
                }
            } else {
                call.close();
            }
        }

        function setupConn(c) {
            if (!c) return;
            if (connections.has(c.peer) && connections.get(c.peer) === c) return;

            const init = () => {
                if (connections.has(c.peer)) return;
                connections.set(c.peer, c);
                updateUI();
                c.send({ type: 'intro', name: document.getElementById('userName').value });
            };

            const isHub = c.peer.includes('-H-');

            if (c.open) {
                if (isHub && !isHost) c.send({ type: 'join_request', name: document.getElementById('userName').value });
                else if (!isHub) init();
            } else {
                c.on('open', () => {
                    if (isHub && !isHost) c.send({ type: 'join_request', name: document.getElementById('userName').value });
                    else if (!isHub) init();
                });
            }

            c.on('data', d => {
                if (d.type === 'chat') {
                    if (d.gif) addChatMsg(d.name, '', 'received', d.id, { isGif: true, gifUrl: d.gif });
                    else addChatMsg(d.name, d.text, 'received', d.id);
                }
                else if (d.type === 'file') receiveFile(d);
                else if (d.type === 'typing') handleTypingUI(d);
                else if (d.type === 'reaction') handleReactionUI(d);
                else if (d.type === 'ping') handlePing(d.name);
                else if (d.type === 'join_response') {
                    if (d.allowed) {
                        addSystemMsg("Host approved entry.");
                        init();
                        if (d.peerList) d.peerList.forEach(pid => {
                            if (pid !== peer.id && !connections.has(pid)) setupConn(peer.connect(pid));
                        });
                    } else {
                        addSystemMsg("ENTRY DENIED: " + d.reason);
                        c.close();
                        if (isHub) peer.destroy();
                    }
                }
                else if (d.type === 'intro') {
                    const isNew = !c.remoteName;
                    c.remoteName = d.name;
                    if (isNew) addSystemMsg(`${d.name} joined the room`);
                    updateUI();
                }
                else if (d.type === 'mesh_gossip') {
                    d.ids.forEach(pid => {
                        if (pid !== peer.id && !connections.has(pid)) setupConn(peer.connect(pid));
                    });
                }
                else if (d.type === 'mesh_sync') { if (d.id !== peer.id && !connections.has(d.id)) setupConn(peer.connect(d.id)); }
                else if (d.type === 'invite') handleInvite(d);
                else if (d.type === 'file-chunk') handleFileChunk(d);
            });
            c.on('close', () => {
                if (connections.has(c.peer)) {
                    const name = c.remoteName || 'A peer';
                    addSystemMsg(`${name} left the room`);
                    connections.delete(c.peer);
                    updateUI();

                    // If the hub connection closed and we aren't the host, try to become the hub
                    if (c.peer.includes('-H-') && !isHost) {
                        addSystemMsg("Host connection lost. Attempting to become the new room host...");
                        startP2P(document.getElementById('ipTag').innerText.replace('Sync ID: ', ''));
                    }
                }
            });
        }

        function updateGroupBtn() {
            const selected = document.querySelectorAll('.peer-selector:checked');
            const btn = document.getElementById('createGroupBtn');
            btn.innerText = `Create Group (${selected.length})`;
            btn.style.display = selected.length > 0 ? 'block' : 'none';
        }

        function createGroup() {
            const selected = Array.from(document.querySelectorAll('.peer-selector:checked')).map(cb => cb.value);
            if (selected.length === 0) return;

            const groupName = prompt("Enter a name for your new group:", "Private Group " + Math.random().toString(36).substring(2, 5).toUpperCase());
            if (!groupName) return;

            const cleanGroupName = groupName.toUpperCase().replace(/[^A-Z0-9]/g, '-');
            const myName = document.getElementById('userName').value;

            selected.forEach(id => {
                const c = connections.get(id);
                if (c && c.open) {
                    c.send({ type: 'invite', room: cleanGroupName, from: myName });
                }
            });

            addSystemMsg(`CREATING GROUP "${cleanGroupName}" AND SWITCHING...`);
            setTimeout(() => joinRoom(cleanGroupName), 500);
        }

        function handleInvite(d) {
            if (confirm(`${d.from} invited you to join a private group: "${d.room}". Join now?`)) {
                joinRoom(d.room);
            }
        }

        function joinRoom(roomKey) {
            if (peer) peer.destroy();
            if (hubPeer) hubPeer.destroy();
            connections.clear();
            updateUI();

            // Clear previous room messages
            document.getElementById('messages').innerHTML = `
                <div class="msg received">
                    <div style="font-size:0.7rem; opacity:0.6; margin-bottom:4px;">System</div>
                    <b>Switched to Room: ${roomKey}</b>. Connection establishing...
                </div>
            `;

            document.getElementById('ipTag').innerText = `Sync ID: ${roomKey}`;
            startP2P(roomKey);
            addSystemMsg(`JOINED ROOM: ${roomKey}`);
        }

        // --- Call Features ---
        async function startGroupCall() {
            if (connections.size === 0) return alert("No peers online to call!");

            try {
                if (!localStream) {
                    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                    document.getElementById('localVideo').srcObject = localStream;
                }
                document.getElementById('callOverlay').style.display = 'flex';

                connections.forEach((conn, id) => {
                    if (id.includes('-H-')) return;
                    if (!activeCalls.has(id)) {
                        const call = peer.call(id, localStream);
                        setupCall(call);
                    }
                });
            } catch (err) {
                alert("Camera/Mic access denied.");
            }
        }

        async function startCall(remoteId, video = true) {
            try {
                if (!localStream) {
                    addSystemMsg(`REQUESTING CAMERA/MIC...`);
                    localStream = await navigator.mediaDevices.getUserMedia({ video: video, audio: true });
                    document.getElementById('localVideo').srcObject = localStream;
                }
                document.getElementById('callOverlay').style.display = 'flex';

                const call = peer.call(remoteId, localStream);
                setupCall(call);
            } catch (err) {
                console.error(err);
                alert("Camera/Microphone access denied or not available.");
            }
        }

        function setupCall(call) {
            if (activeCalls.has(call.peer)) return;
            activeCalls.set(call.peer, call);

            document.getElementById('callOverlay').style.display = 'flex';
            document.getElementById('callStatus').innerText = `${activeCalls.size} Participant(s)`;

            call.on('stream', remoteStream => {
                let container = document.getElementById('cont-' + call.peer);
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'cont-' + call.peer;
                    container.className = 'video-container';

                    const peerName = (connections.get(call.peer) && connections.get(call.peer).remoteName) || 'Peer';

                    container.innerHTML = `
                        <video id="vid-${call.peer}" autoplay playsinline></video>
                        <div class="video-label">${peerName}</div>
                    `;
                    document.getElementById('remoteVideos').appendChild(container);
                }
                const vid = document.getElementById('vid-' + call.peer);
                if (vid) vid.srcObject = remoteStream;
            });

            call.on('close', () => {
                const container = document.getElementById('cont-' + call.peer);
                if (container) container.remove();
                activeCalls.delete(call.peer);
                if (activeCalls.size === 0) endCall(false);
                else document.getElementById('callStatus').innerText = `${activeCalls.size} Participant(s)`;
            });

            call.on('error', () => {
                const container = document.getElementById('cont-' + call.peer);
                if (container) container.remove();
                activeCalls.delete(call.peer);
            });
        }

        function endCall(notify = true) {
            activeCalls.forEach(call => {
                if (notify) call.close();
            });
            activeCalls.clear();

            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            document.getElementById('callOverlay').style.display = 'none';
            document.getElementById('remoteVideos').innerHTML = "";
            document.getElementById('localVideo').srcObject = null;

            // Reset buttons
            document.getElementById('micBtn').classList.remove('active');
            document.getElementById('camBtn').classList.remove('active');
            document.getElementById('micBtn').innerText = '🎤';
            document.getElementById('camBtn').innerText = '📷';
        }

        function toggleMic() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                const btn = document.getElementById('micBtn');
                btn.classList.toggle('active', !audioTrack.enabled);
                btn.innerText = audioTrack.enabled ? '🎤' : '🔇';
            }
        }

        function toggleCam() {
            if (!localStream) return;
            const videoTrack = localStream.getVideoTracks()[0];
            if (videoTrack) {
                videoTrack.enabled = !videoTrack.enabled;
                const btn = document.getElementById('camBtn');
                btn.classList.toggle('active', !videoTrack.enabled);
                btn.innerText = videoTrack.enabled ? '📷' : '🚫';
            }
        }

        // --- Logic ---
        const TENOR_KEY = "LIVDSRZULELA";
        let gifTimeout;

        function toggleGiphy() {
            const panel = document.getElementById('giphyPanel');
            panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
            if (panel.style.display === 'flex') {
                document.getElementById('giphySearch').focus();
                searchGIFs("");
            }
        }

        async function searchGIFs(q) {
            clearTimeout(gifTimeout);
            gifTimeout = setTimeout(async () => {
                const url = q ? `https://api.tenor.com/v1/search?q=${encodeURIComponent(q)}&key=${TENOR_KEY}&limit=20` : `https://api.tenor.com/v1/trending?key=${TENOR_KEY}&limit=20`;
                try {
                    const res = await fetch(url);
                    const { results } = await res.json();
                    if (!results) return;
                    const grid = document.getElementById('giphyGrid');
                    grid.innerHTML = results.map(g => `<img src="${g.media[0].tinygif.url}" class="giphy-thumb" onclick="sendGIF('${g.media[0].gif.url}')">`).join('');
                } catch (err) { console.error("GIF Search Error:", err); }
            }, 300);
        }

        function sendGIF(url) {
            const myName = document.getElementById('userName').value;
            const msgId = 'G' + Date.now();
            connections.forEach(c => c.send({ type: 'chat', text: '', gif: url, name: myName, id: msgId }));
            addChatMsg(myName, '', 'sent', msgId, { isGif: true, gifUrl: url });
            toggleGiphy();
        }

        let typingTimer;
        function sendTyping() {
            connections.forEach(c => c.send({ type: 'typing', name: document.getElementById('userName').value, active: true }));
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => connections.forEach(c => c.send({ type: 'typing', active: false })), 2000);
        }

        function handleTypingUI(d) {
            const el = document.getElementById('typingArea');
            el.innerText = d.active ? `${d.name} is typing...` : "";
            el.classList.toggle('active', d.active);
        }

        async function sendFiles(files) {
            if (!files || files.length === 0) return;
            for (const file of Array.from(files)) {
                await sendFile(file);
            }
            document.getElementById('fileInput').value = ''; // Reset
        }

        async function sendFile(file) {
            if (!file) return;
            const myName = document.getElementById('userName').value;
            const fileId = 'F' + Date.now() + Math.random().toString(36).substring(2, 6);
            const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

            addChatMsg("You", `Sending: ${file.name}`, 'sent', fileId, {
                fileName: file.name,
                isStreaming: true,
                totalSize: (file.size / (1024 * 1024)).toFixed(2) + ' MB'
            });

            let offset = 0;
            let index = 0;
            while (offset < file.size) {
                const slice = file.slice(offset, offset + CHUNK_SIZE);
                const buffer = await slice.arrayBuffer();

                const data = {
                    type: 'file-chunk',
                    fileId,
                    fileName: file.name,
                    fileType: file.type,
                    chunk: buffer,
                    index: index,
                    total: totalChunks,
                    name: myName
                };

                connections.forEach(c => c.send(data));

                offset += CHUNK_SIZE;
                index++;

                const progress = Math.min(100, (offset / file.size) * 100);
                updateProgressUI(fileId, progress);

                // Small sleep to prevent channel congestion on very fast networks
                if (index % 10 === 0) await new Promise(r => setTimeout(r, 10));
            }

            // After all chunks sent, we finalize our own UI
            const reader = new FileReader();
            reader.onload = () => finalizeFileUI(fileId, reader.result, file.type, file.name);
            reader.readAsDataURL(file);
        }

        function handleFileChunk(d) {
            if (!fileChunks[d.fileId]) {
                fileChunks[d.fileId] = { chunks: [], received: 0, total: d.total };
                addChatMsg(d.name, `Receiving: ${d.fileName}`, 'received', d.fileId, {
                    fileName: d.fileName,
                    isStreaming: true
                });
            }

            const f = fileChunks[d.fileId];
            if (!f.chunks[d.index]) {
                f.chunks[d.index] = d.chunk;
                f.received++;

                const progress = (f.received / f.total) * 100;
                updateProgressUI(d.fileId, progress);

                if (f.received === f.total) {
                    const blob = new Blob(f.chunks, { type: d.fileType });
                    const url = URL.createObjectURL(blob);
                    finalizeFileUI(d.fileId, url, d.fileType, d.fileName);
                    delete fileChunks[d.fileId];
                }
            }
        }

        function updateProgressUI(fileId, progress) {
            const el = document.querySelector(`[data-id="${fileId}"] .progress-bar`);
            if (el) el.style.width = progress + '%';
        }

        function finalizeFileUI(fileId, dataUrl, type, name) {
            const msgEl = document.querySelector(`[data-id="${fileId}"] .file-content`);
            if (!msgEl) return;

            let html = "";
            if (type.startsWith('image/')) {
                html = `<div class="file-preview"><img src="${dataUrl}" onclick="window.open(this.src)"></div>`;
            } else {
                html = `<div style="margin-top:5px"><button class="btn-primary" style="font-size:0.6rem" onclick="const a=document.createElement('a'); a.href='${dataUrl}'; a.download='${name}'; a.click();">Download ${name}</button></div>`;
            }
            msgEl.innerHTML = html;

            // Remove progress bar
            const progressContainer = document.querySelector(`[data-id="${fileId}"] .progress-container`);
            if (progressContainer) progressContainer.remove();
        }

        function receiveFile(d) { addChatMsg(d.name, `Sent: ${d.fileName}`, 'received', d.id, d); }

        function sendAll() {
            const i = document.getElementById('chatInput');
            const t = i.value.trim();
            if (!t) return;
            const myName = document.getElementById('userName').value;
            const msgId = 'M' + Date.now();
            connections.forEach(c => c.send({ type: 'chat', text: t, name: myName, id: msgId }));
            addChatMsg(myName, t, 'sent', msgId);
            i.value = "";
        }

        function addReaction(msgId, emoji) {
            connections.forEach(c => c.send({ type: 'reaction', msgId, emoji }));
            handleReactionUI({ msgId, emoji });
        }

        function handleReactionUI(d) {
            const reactionsContainer = document.querySelector(`[data-id="${d.msgId}"] .reactions`);
            if (reactionsContainer) {
                let chip = reactionsContainer.querySelector(`[data-emoji="${d.emoji}"]`);
                if (chip) {
                    let countEl = chip.querySelector('.count');
                    let count = parseInt(countEl.innerText) + 1;
                    countEl.innerText = count;
                    chip.classList.add('has-count');
                } else {
                    chip = document.createElement('div');
                    chip.className = 'reaction-chip';
                    chip.setAttribute('data-emoji', d.emoji);
                    chip.innerHTML = `${d.emoji} <span class="count">1</span>`;
                    reactionsContainer.appendChild(chip);
                }
            }
        }

        function relayNewNode(newNodeId) {
            connections.forEach(c => {
                if (c.open && c.peer !== newNodeId) {
                    c.send({ type: 'mesh_sync', id: newNodeId });
                    const newcomer = connections.get(newNodeId);
                    if (newcomer && newcomer.open) newcomer.send({ type: 'mesh_sync', id: c.peer });
                }
            });
        }

        // --- Audio/Visual ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }
        window.addEventListener('mousedown', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });
        window.addEventListener('keydown', initAudio, { once: true });

        function playPingSound() {
            initAudio();
            const ctx = audioCtx; if (!ctx) return;
            const playNote = (freq, start, duration) => {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'sine'; osc.frequency.setValueAtTime(freq, start);
                gain.gain.setValueAtTime(0.1, start); gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(start); osc.stop(start + duration);
            };
            playNote(880, ctx.currentTime, 0.2); playNote(1046, ctx.currentTime + 0.1, 0.3);
        }

        let lastPing = { from: "", count: 0, el: null };
        function handlePing(from) {
            document.getElementById('appShell').classList.add('shake');
            setTimeout(() => document.getElementById('appShell').classList.remove('shake'), 400);
            playPingSound();
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

            if (lastPing.from === from && lastPing.el && lastPing.el.parentElement) {
                lastPing.count++;
                lastPing.el.innerHTML = `<div style="font-size:0.6rem; opacity:0.6;">SYSTEM</div>🔔 [${lastPing.count}x] PING RECEIVED FROM ${from}!`;
            } else {
                lastPing = { from: from, count: 1, el: null };
                const d = document.createElement('div');
                d.className = `msg alert`;
                d.innerHTML = `<div style="font-size:0.6rem; opacity:0.6;">SYSTEM</div>🔔 PING RECEIVED FROM ${from}!`;
                document.getElementById('messages').appendChild(d);
                lastPing.el = d;
            }
            document.getElementById('messages').scrollTop = 99999;
        }

        function pingUser(id) {
            const c = connections.get(id);
            if (c && c.open) {
                c.send({ type: 'ping', name: document.getElementById('userName').value });
                addSystemMsg(`SENT PING TO ${c.remoteName || id.split('-').pop()}`);
            }
        }

        function pingAll() {
            const name = document.getElementById('userName').value;
            connections.forEach(c => c.send({ type: 'ping', name }));
            addSystemMsg("GLOBAL PING BROADCASTED");
        }

        function exportChat() {
            const log = Array.from(document.querySelectorAll('.msg')).map(m => m.innerText.replace(/\n/g, ' ')).join('\n');
            const blob = new Blob([log], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'mesh_log.txt'; a.click();
        }

        function updateUI() {
            const l = document.getElementById('peerStack'); l.innerHTML = "";
            let count = 0;
            connections.forEach((c, id) => {
                if (id.includes('-H-')) return;
                count++;
                const uName = c.remoteName || 'Device-' + id.split('-').pop();
                const d = document.createElement('div');
                d.className = 'peer-card';
                d.innerHTML = `
                    <input type="checkbox" class="peer-selector" value="${id}" onchange="updateGroupBtn()" style="width:18px; height:18px; cursor:pointer;">
                    <div class="peer-avatar" style="background:${getColor(uName)}">${uName.charAt(0).toUpperCase()}</div>
                    <div style="flex:1">
                        <div style="font-size:0.85rem; font-weight:bold;">${uName}</div>
                        <div style="font-size:0.65rem; color:var(--success);">Online</div>
                    </div>
                    <div style="display:flex; gap:4px">
                        <button class="btn-primary" style="font-size:0.6rem; padding:4px 8px; background:var(--success)" onclick="startCall('${id}')">🎥</button>
                        <button class="btn-primary" style="font-size:0.6rem; padding:4px 8px;" onclick="pingUser('${id}')">PING</button>
                    </div>
                `;
                l.appendChild(d);
            });
            document.getElementById('meshCount').innerText = `${count} Peers Online`;
            updateGroupBtn();
            if (count === 0) l.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.75rem;">Waiting for devices...</div>`;
        }

        function addChatMsg(s, t, cl, id, fileData = null) {
            lastPing = { from: "", count: 0, el: null };
            const d = document.createElement('div');
            d.className = `msg ${cl}`; d.setAttribute('data-id', id || 'sys');
            const avatarHtml = `<div class="peer-avatar" style="width:18px; height:18px; font-size:0.55rem; margin-right:6px; display:inline-flex; background:${getColor(s)}">${s.charAt(0).toUpperCase()}</div>`;

            let contentHtml = `<div class="file-content"><div>${t}</div></div>`;
            if (fileData && fileData.isGif) {
                contentHtml = `<div class="file-content"><div class="file-preview"><img src="${fileData.gifUrl}" style="max-height:200px; width:auto; border-radius:12px;"></div></div>`;
            } else if (fileData && !fileData.isStreaming) {
                if (fileData.fileType && fileData.fileType.startsWith('image/')) {
                    contentHtml = `<div class="file-content"><div>${t}</div><div class="file-preview"><img src="${fileData.fileData}" onclick="window.open(this.src)"></div></div>`;
                } else {
                    contentHtml = `<div class="file-content"><div>${t}</div><div style="margin-top:5px"><button class="btn-primary" style="font-size:0.6rem" onclick="const a=document.createElement('a'); a.href='${fileData.fileData}'; a.download='${fileData.fileName}'; a.click();">Download ${fileData.fileName}</button></div></div>`;
                }
            } else if (fileData && fileData.isStreaming) {
                contentHtml = `
                    <div class="file-content">
                        <div>${t} ${fileData.totalSize ? `(${fileData.totalSize})` : ''}</div>
                        <div class="progress-container"><div class="progress-bar"></div></div>
                        <div class="file-info">Streaming chunks...</div>
                    </div>
                `;
            }

            d.innerHTML = `
                <div style="display:flex; align-items:center; font-size:0.7rem; opacity:0.8; margin-bottom:4px; font-weight:bold;">${avatarHtml} ${s}</div>
                ${contentHtml}
                <div class="reactions" style="display:flex; margin-top:5px"></div>
                ${id ? `
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <span style="font-size:0.8rem; cursor:pointer;" onclick="addReaction('${id}', '👍')">👍</span>
                    <span style="font-size:0.8rem; cursor:pointer;" onclick="addReaction('${id}', '❤️')">❤️</span>
                    <span style="font-size:0.8rem; cursor:pointer;" onclick="addReaction('${id}', '😂')">😂</span>
                    <span style="font-size:0.8rem; cursor:pointer;" onclick="addReaction('${id}', '😮')">😮</span>
                    <span style="font-size:0.8rem; cursor:pointer;" onclick="addReaction('${id}', '�')">😢</span>
                    <span style="font-size:0.8rem; cursor:pointer;" onclick="addReaction('${id}', '🔥')">�</span>
                </div>
                ` : ''}
            `;
            document.getElementById('messages').appendChild(d);
            document.getElementById('messages').scrollTop = 99999;
        }

        function addSystemMsg(t) {
            lastPing = { from: "", count: 0, el: null };
            const d = document.createElement('div');
            d.style = 'text-align:center; font-size:0.7rem; color:var(--text-muted); margin:10px 0';
            d.innerText = `— ${t} —`;
            document.getElementById('messages').appendChild(d);
            document.getElementById('messages').scrollTop = 99999;
        }

        init();
        function openOfflineSub() { window.open(`https://ntfy.sh/antigravity_p2p_${myShortId}`, '_blank'); }

        window.onbeforeunload = function() {
            return "Are you sure you want to leave the chat room? Refreshing will close all your active peer connections.";
        };
    </script>
